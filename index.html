<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff8ec">
  <meta name="description" content="回答 24 道生活小问题，看看你是哪一种小狗性格。轻松有趣的 DogTi 小狗性格测试，附专属结果卡片与犬系图鉴。">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_CN">
  <meta property="og:title" content="DogTi｜测测你是什么小狗">
  <meta property="og:description" content="用 24 道生活小问题，解锁你的专属犬系人格和小狗图鉴。">
  <meta property="og:image" content="assets/icons/dogti-social.svg">
  <meta name="twitter:card" content="summary">
  <title>DogTi｜测测你是什么小狗</title>
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pairing.css">
  <script defer src="js/data.js"></script>
  <script defer src="js/repair.js"></script>
  <script defer src="js/storage.js"></script>
  <script defer src="js/scoring.js"></script>
  <script defer src="js/quiz.js"></script>
  <script defer src="js/share.js"></script>
  <script defer src="js/pairing.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header class="topbar">
    <a class="brand" href="#home" aria-label="DogTi 首页">DogTi</a>
    <button class="text-button" id="header-atlas" type="button">狗狗图鉴</button>
  </header>
  <main id="main">
    <section class="screen home-screen is-active" id="home" aria-labelledby="home-title">
      <div class="hero-copy">
        <h1 id="home-title">测测你是什么<br><span>小狗</span>性格！</h1>
        <div class="hero-actions">
          <button class="button button-primary" id="start-button" type="button">开始测试</button>
          <button class="button button-secondary" id="home-atlas" type="button">狗狗图鉴</button>
        </div>
      </div>
    </section>

    <section class="screen quiz-screen" id="quiz" aria-labelledby="question-title" hidden>
      <div class="quiz-heading">
        <button class="icon-button" id="quiz-home" type="button" aria-label="返回首页">←</button>
      </div>
      <div class="progress-row"><span id="question-counter">第 1 / 24 题</span><span id="progress-percent">4%</span></div>
      <div class="progress-track" role="progressbar" aria-label="测试进度" aria-valuemin="0" aria-valuemax="24" aria-valuenow="0"><span id="progress-fill"></span></div>
      <div class="question-card" id="question-card" aria-live="polite">
        <p class="question-label" id="question-category">生活切片</p><h1 id="question-title">准备好了吗？</h1>
        <div class="answer-list" id="answer-list" role="group" aria-labelledby="question-title"></div>
      </div>
      <div class="quiz-footer"><button class="button button-quiet" id="previous-button" type="button" disabled>← 上一题</button><span>自动保存</span></div>
    </section>

    <section class="screen loading-screen" id="loading" aria-live="polite" hidden>
      <div class="sniff-dog" aria-hidden="true">🐶</div><p class="eyebrow">NOSE AT WORK</p><h1>小狗正在闻闻<br>你的性格……</h1><p>请给鼻子一点点时间</p><div class="sniff-dots" aria-hidden="true"><span></span><span></span><span></span></div>
    </section>

    <section class="screen result-screen" id="result" aria-labelledby="result-heading" hidden>
      <div class="result-topline"><button class="text-button" id="result-home" type="button">← 返回</button><span class="result-ribbon">犬系人格</span></div>
      <article class="result-card" id="share-card">
        <div class="result-art" id="result-art" aria-hidden="true"></div>
        <p class="eyebrow">结果</p><h1 id="result-heading">正在寻找你的犬系人格</h1>
        <p class="result-tagline" id="result-tagline"></p><div class="keyword-list" id="result-keywords"></div>
        <div class="dimension-panel"><h2>你的性格小雷达</h2><div id="dimension-bars" class="dimension-bars"></div></div>
        <div class="analysis-grid" id="analysis-grid"></div>
        <p class="result-disclaimer">娱乐测试结果，不属于专业心理测评。</p>
      </article>
      <div class="result-actions">
        <button class="button button-primary" id="copy-link" type="button">复制结果链接</button>
        <button class="button button-secondary" id="share-native" type="button">分享结果</button>
        <button class="button button-secondary" id="copy-text" type="button">复制结果文案</button>
        <button class="button button-secondary" id="download-card" type="button">下载结果卡</button>
        <button class="button button-quiet" id="retake-button" type="button">再测一次</button>
        <button class="button button-quiet" id="result-atlas" type="button">狗狗图鉴</button>
      </div>
    </section>

    <section class="screen atlas-screen" id="atlas" aria-labelledby="atlas-title" hidden>
      <div class="section-heading"><button class="icon-button" id="atlas-home" type="button" aria-label="返回首页">←</button><div><p class="eyebrow">DOG LIBRARY</p><h1 id="atlas-title">小狗图鉴</h1></div></div>
      <p class="atlas-intro">已解锁 <strong id="unlock-count">0</strong> / 12</p>
      <div class="atlas-grid" id="atlas-grid"></div>
    </section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="confirm-layer" id="confirm-layer" hidden>
    <section class="confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-message">
      <span class="dialog-paw" aria-hidden="true">🐾</span><h2 id="confirm-title">先歇一会儿？</h2><p id="confirm-message">目前的进度会替你保存好。</p>
      <div class="dialog-actions"><button class="button button-quiet" id="confirm-cancel" type="button">继续测试</button><button class="button button-primary" id="confirm-leave" type="button">回到首页</button></div>
    </section>
  </div>
</body>
</html>
